<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDMS - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="theme-day">
    <div class="app-container">
        <nav class="top-navbar">
            <div class="nav-left">
                <button id="sidebarToggle" class="sidebar-toggle">☰</button>
                <h1 class="system-title">TDMS</h1>
                <span class="system-datetime" id="systemDatetime"></span>
            </div>
            <div class="nav-center">
                <div class="welcome-message" id="welcomeMessage">
                    <span class="welcome-text">WELCOME TO THE TRAINING & DEVELOPMENT SYSTEM</span>
                </div>
            </div>
            <div class="nav-right">
                <button id="themeToggle" class="theme-toggle" title="Toggle Theme">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    </svg>
                </button>
                <div class="user-profile">
                    <span class="user-avatar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <defs>
                                <linearGradient id="avatarGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.95"/>
                                    <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.6"/>
                                </linearGradient>
                            </defs>
                            <circle cx="12" cy="8" r="4" fill="url(#avatarGlass)" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M4 20c0-4 4-7 8-7s8 3 8 7" fill="url(#avatarGlass)" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </span>
                    <span class="user-name">Admin</span>
                </div>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </nav>

        <div class="main-wrapper">
            <aside class="sidebar" id="sidebar">
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item active" data-module="dashboard">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                                <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                                <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                                <rect x="3" y="16" width="7" height="5" rx="1.5"/>
                            </svg>
                        </span>
                        <span class="nav-text">Dashboard</span>
                    </a>
                    <a href="#" class="nav-item" data-module="tna">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="9" y1="21" x2="9" y2="9"/>
                                <line x1="9" y1="14" x2="15" y2="14"/>
                                <line x1="9" y1="17" x2="14" y2="17"/>
                            </svg>
                        </span>
                        <span class="nav-text">Training Needs Analysis</span>
                    </a>
                    <a href="#" class="nav-item" data-module="request">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                <polyline points="14,2 14,8 20,8"/>
                                <line x1="9" y1="13" x2="15" y2="13"/>
                                <line x1="9" y1="17" x2="13" y2="17"/>
                            </svg>
                        </span>
                        <span class="nav-text">Training Request</span>
                    </a>
                    <a href="#" class="nav-item" data-module="record">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="9" y1="21" x2="9" y2="9"/>
                                <circle cx="15" cy="15" r="3"/>
                            </svg>
                        </span>
                        <span class="nav-text">Training Record</span>
                    </a>
                    <a href="#" class="nav-item" data-module="attendance">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="8,12 11,15 16,9"/>
                            </svg>
                        </span>
                        <span class="nav-text">Attendance</span>
                    </a>
                    <a href="#" class="nav-item" data-module="evaluation">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="20" x2="21" y2="20"/>
                                <polyline points="6,16 10,10 14,14 18,8"/>
                                <circle cx="18" cy="8" r="2" fill="currentColor" opacity="0.3"/>
                            </svg>
                        </span>
                        <span class="nav-text">Evaluation</span>
                    </a>
                    <a href="#" class="nav-item" data-module="calendar">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <rect x="7" y="13" width="3" height="3" rx="0.5" fill="currentColor" opacity="0.3"/>
                                <rect x="14" y="13" width="3" height="3" rx="0.5" fill="currentColor" opacity="0.3"/>
                            </svg>
                        </span>
                        <span class="nav-text">Calendar</span>
                    </a>
                    <a href="#" class="nav-item" data-module="expenditure">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="6" x2="12" y2="18"/>
                                <path d="M15 9.5c0-1.5-1.5-2.5-3-2.5s-3 1-3 2.5 1.5 2 3 2.5 3 1 3 2.5-1.5 2.5-3 2.5-3-1-3-2.5"/>
                            </svg>
                        </span>
                        <span class="nav-text">Expenditure</span>
                    </a>
                    <a href="#" class="nav-item" data-module="report">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 3h8l4 4v14H6z"/>
                                <polyline points="14,3 14,7 18,7"/>
                                <line x1="9" y1="12" x2="15" y2="12"/>
                                <line x1="9" y1="15" x2="15" y2="15"/>
                                <line x1="9" y1="18" x2="12" y2="18"/>
                            </svg>
                        </span>
                        <span class="nav-text">Post Training Report</span>
                    </a>
                    <a href="#" class="nav-item" data-module="masterlist">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <line x1="3" y1="8" x2="21" y2="8"/>
                                <line x1="3" y1="13" x2="21" y2="13"/>
                                <line x1="3" y1="18" x2="15" y2="18"/>
                                <line x1="8" y1="3" x2="8" y2="8"/>
                            </svg>
                        </span>
                        <span class="nav-text">Master List</span>
                    </a>
                    <a href="#" class="nav-item" data-module="backup">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 9h-4V4H9v5H5l7 7 7-7z"/>
                                <rect x="5" y="18" width="14" height="3" rx="1"/>
                            </svg>
                        </span>
                        <span class="nav-text">Backup System</span>
                    </a>
                    <a href="#" class="nav-item" data-module="reset">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 0115-6.7L21 8"/>
                                <path d="M21 12a9 9 0 01-15 6.7L3 16"/>
                                <polyline points="21,3 21,8 16,8"/>
                                <polyline points="3,21 3,16 8,16"/>
                            </svg>
                        </span>
                        <span class="nav-text">System Reset</span>
                    </a>
                </nav>
            </aside>

            <main class="main-content" id="mainContent">
            </main>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
